<!-- 
  =============================================================================
  INDEX.HTML - Application Shell & Entry Point (SEO-Optimized)
  =============================================================================
  This file is the root HTML template for the Vite + React single page app.
  
  HOW TO CUSTOMIZE:
  - Title & Meta Tags: Modify the <title> and <meta name="description"> below
    to change your SEO preview and social media cards.
  - Open Graph (OG) tags: Update og:title, og:description, og:image for social sharing.
  - Twitter Card tags: Update twitter:title, twitter:description for Twitter/X sharing.
  - Canonical URL: Update the <link rel="canonical"> to your deployed domain.
  - Structured Data: Update the JSON-LD script with your real info (name, URLs, etc.).
  - Fonts: We preconnect and load 'Inter' and 'Space Grotesk' from Google Fonts.
    If you add new fonts, update the <link> tags here and in tailwind.config.js.
  - Favicon: The <link rel="icon"> points to /avater.png in the /public folder.
  =============================================================================
-->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Ensures proper mobile responsive viewport scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===================== SEO CORE META TAGS ===================== -->
  <!-- Page Title: Include primary keyword + brand name (50-60 chars ideal) -->
  <title>Mominul Islam | Full Stack Web Developer — React, PHP & MySQL Portfolio</title>

  <!-- Meta Description: Compelling summary with keywords (150-160 chars ideal) -->
  <meta name="description"
    content="Mominul Islam is a full stack web developer from Khulna, Bangladesh. Explore his portfolio of modern, high-performance web experiences built with React, PHP, MySQL, and Tailwind CSS." />

  <!-- Author -->
  <meta name="author" content="Mominul Islam" />

  <!-- Target keywords for search engines -->
  <meta name="keywords"
    content="Mominul Islam, full stack developer, web developer, React developer, PHP developer, MySQL, Tailwind CSS, portfolio, Bangladesh, Khulna, frontend developer, backend developer, web design, freelance developer" />

  <!-- Tell search engines to index this page and follow all links -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Canonical URL: Prevents duplicate content issues -->
  <link rel="canonical" href="https://mominul-portfolio.vercel.app/" />

  <!-- Browser mobile address bar color in dark mode -->
  <meta name="theme-color" content="#050816" />

  <!-- ===================== OPEN GRAPH (Facebook, LinkedIn, Discord) ===================== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mominul Islam Portfolio" />
  <meta property="og:title" content="Mominul Islam | Full Stack Web Developer" />
  <meta property="og:description"
    content="Explore the portfolio of Mominul Islam — a passionate full stack developer building modern web experiences with React, PHP, MySQL, Tailwind CSS, and cinematic animation." />
  <meta property="og:url" content="https://mominul-portfolio.vercel.app/" />
  <!-- Social sharing preview image -->
  <meta property="og:image" content="https://mominul-portfolio.vercel.app/avater.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Mominul Islam — Full Stack Web Developer Portfolio" />
  <meta property="og:locale" content="en_US" />

  <!-- ===================== TWITTER / X CARD ===================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mominul Islam | Full Stack Web Developer" />
  <meta name="twitter:description"

  <meta name="twitter:image:alt" content="Mominul Islam — Full Stack Web Developer Portfolio" />

  <!-- ===================== FAVICONS & APP MANIFEST ===================== -->

  <link rel="icon" type="image/png" href="/avater.png" />
  <!-- Apple Touch Icon for iOS home screen bookmarks -->
  <link rel="apple-touch-icon" href="/avater.png" />
  <!-- Web App Manifest for PWA support and richer search results -->
  <link rel="manifest" href="/manifest.json" />

  <!-- ===================== GOOGLE FONTS ===================== -->
  <!-- Preconnect for faster DNS lookup and TLS handshake -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Primary fonts: 'Inter' (body text) and 'Space Grotesk' (display/headings) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
